# ==============================================
# ALAMBIĆ - CONFIGURAÇÃO PRINCIPAL
# ==============================================
# Este arquivo controla o comportamento do Alembic.
# A URL do banco é definida dinamicamente pelo arquivo env.py
# a partir do DATABASE_URL do config.py, então o valor abaixo
# pode ser mantido como placeholder.

[alembic]
# Caminho para o script de migração
script_location = database/migrations

# Prefixo para arquivos de migração
file_template = %%(rev)s_%%(slug)s

# Timezone para datas nas migrações
# timezone = UTC

# Define o encoding dos arquivos de migração
# output_encoding = utf-8

# URL do banco de dados (placeholder; será sobrescrita no env.py)
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/larizinhastore

# ==============================================
# LOGGING
# ==============================================
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
